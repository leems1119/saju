<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 무료 운세 및 사주 분석기</title>
    <meta name="description" content="이름과 생년월일만으로 간단하게 알아보는 나의 오늘 운세와 탄생석 분석 결과를 확인해보세요!">
    
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            overflow: hidden; 
            transition: background-color 1s ease-in-out;
        }
        
        .bg-normal { background-color: #f3f4f6; } 
        .bg-pink { background-color: #ffe4e1; } 

        .loader { 
            border: 4px solid #e5e7eb; 
            border-top: 4px solid #4b5563; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .floating-symbol {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear infinite;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .confession-box {
            z-index: 10; 
            text-align: center; 
            background-color: rgba(255, 255, 255, 0.85); 
            padding: 40px; 
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            position: relative;
        }
    </style>
</head>
<body class="bg-normal">
    <div id="root"></div>

    <script type="text/babel">
        const App = () => {
            const [step, setStep] = React.useState('INPUT'); 
            const [name, setName] = React.useState('');
            const [birthday, setBirthday] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setStep('LOADING');
                
                setTimeout(() => {
                    setStep('CONFESSION');
                }, 3000);
            };

            React.useEffect(() => {
                document.body.className = step === 'CONFESSION' ? 'bg-pink' : 'bg-normal';
            }, [step]);

            const generateParticles = () => {
                const symbols = ['♥', '♡', '★', '☆', '✿', '✦', '✧', '❥', '♪'];
                const particles = [];
                
                for (let i = 0; i < 50; i++) {
                    const symbol = symbols[Math.floor(Math.random() * symbols.length)];
                    const left = Math.random() * 100 + 'vw';
                    const animationDuration = (Math.random() * 4 + 3) + 's'; 
                    const animationDelay = (Math.random() * 3) + 's'; 
                    const fontSize = (Math.random() * 20 + 15) + 'px';
                    const color = Math.random() > 0.5 ? '#ff69b4' : '#ff1493'; 
                    
                    particles.push(
                        <div key={i} className="floating-symbol" style={{
                            left, 
                            animationDuration, 
                            animationDelay, 
                            fontSize, 
                            color
                        }}>
                            {symbol}
                        </div>
                    );
                }
                return particles;
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', position: 'relative' }}>
                    
                    {step === 'INPUT' && (
                        <div style={{ background: 'white', padding: '40px', borderRadius: '15px', boxShadow: '0 4px 6px rgba(0,0,0,0.05)', textAlign: 'center', width: '300px', zIndex: 10 }}>
                            <h2 style={{ color: '#333', marginTop: 0 }}>일일 운세 분석</h2>
                            <p style={{ color: '#666', fontSize: '14px', marginBottom: '20px' }}>정확한 결과를 위해 정보를 입력해주세요.</p>
                            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '15px' }}>
                                <input 
                                    type="text" 
                                    placeholder="이름" 
                                    required 
                                    value={name} 
                                    onChange={e => setName(e.target.value)} 
                                    style={{ padding: '12px', borderRadius: '8px', border: '1px solid #ddd', outline: 'none' }} 
                                />
                                <input 
                                    type="date" 
                                    required 
                                    value={birthday} 
                                    onChange={e => setBirthday(e.target.value)} 
                                    style={{ padding: '12px', borderRadius: '8px', border: '1px solid #ddd', outline: 'none' }} 
                                />
                                <button 
                                    type="submit" 
                                    style={{ padding: '12px', background: '#4b5563', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold' }}>
                                    결과 보기
                                </button>
                            </form>
                        </div>
                    )}
                    
                    {step === 'LOADING' && (
                        <div style={{ textAlign: 'center', zIndex: 10 }}>
                            <div className="loader"></div>
                            <p style={{ marginTop: '20px', fontSize: '16px', color: '#555', fontWeight: 'bold' }}>
                                운세 및 사주 데이터를 분석 중입니다...
                            </p>
                            <p style={{ fontSize: '14px', color: '#888' }}>잠시만 기다려주세요.</p>
                        </div>
                    )}

                    {step === 'CONFESSION' && (
                        <>
                            <div className="confession-box">
                                <h1 style={{ color: '#ff1493', marginBottom: '20px' }}>짠! 서프라이즈!</h1>
                                <p style={{ fontSize: '22px', fontWeight: 'bold', color: '#333', lineHeight: '1.5' }}>
                                    {name}야,<br/>
                                    사실 운세 사이트가 아니었어!<br/>
                                    널 많이 좋아해! ♥
                                </p>
                            </div>
                            {generateParticles()}
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
